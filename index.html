<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 전체 화면 2분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      min-width: 320px;
      background-color: #f8f8f8;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* 검색창 */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .search-box button {
      padding: 12px 18px;
      border: none;
      background-color: #fee500;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box button:hover {
      opacity: 0.9;
    }

    /* 검색 결과 */
    #placesList {
      list-style: none;
    }

    #placesList li {
      padding: 15px;
      margin-bottom: 10px;
      background-color: white;
      border-radius: 10px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: 0.2s;
    }

    #placesList li:hover {
      background-color: #f1f1f1;
    }

    .place-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .place-address {
      font-size: 14px;
      color: #666;
    }

    /* 오른쪽 지도 */
    #map {
      width: 65%;
      height: 100vh;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <div class="sidebar">

      <h1>카카오맵 장소 검색</h1>

      <div class="search-box">
        <input type="text" id="keyword" placeholder="장소를 검색하세요" />
        <button onclick="searchPlaces()">검색</button>
      </div>

      <ul id="placesList"></ul>

    </div>

    <!-- 오른쪽 지도 -->
    <div id="map"></div>

  </div>

  <!-- 카카오맵 SDK -->
  <script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1e75ade410bd5aa93f0e33ea5cffbb8c&libraries=services&autoload=false">
  </script>

  <script>

    let map;
    let currentMarker;
    let markers = [];
    let placesService;

    // 카카오맵 로딩 완료 후 실행
    kakao.maps.load(() => {

      // 현재 위치 가져오기
      navigator.geolocation.getCurrentPosition(

        // 위치 허용 성공
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          initializeMap(latitude, longitude);

        },

        // 위치 허용 실패
        () => {

          alert("위치 권한이 거부되었습니다.");

          // 기본 위치 (서울시청)
          initializeMap(37.5665, 126.9780);

        }

      );

    });

    // 지도 초기화 함수
    function initializeMap(lat, lng) {

      const mapContainer = document.getElementById("map");

      const mapOption = {
        center: new kakao.maps.LatLng(lat, lng),
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 장소 검색 서비스 생성
      placesService = new kakao.maps.services.Places();

      // 현재 위치 마커 표시
      currentMarker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(lat, lng),
        map: map
      });

      // 현재 위치 인포윈도우
      const infoWindow = new kakao.maps.InfoWindow({
        content: "<div style='padding:5px;'>현재 위치</div>"
      });

      infoWindow.open(map, currentMarker);

    }

    // 장소 검색 함수
    function searchPlaces() {

      const keyword = document.getElementById("keyword").value;

      if (!keyword.trim()) {
        alert("검색어를 입력하세요.");
        return;
      }

      // 키워드 검색 실행
      placesService.keywordSearch(keyword, placesSearchCallback);

    }

    // 검색 결과 콜백 함수
    function placesSearchCallback(data, status) {

      if (status === kakao.maps.services.Status.OK) {

        displayPlaces(data);

      } else {

        alert("검색 결과가 없습니다.");

      }

    }

    // 검색 결과 표시 함수
    function displayPlaces(places) {

      const listElement = document.getElementById("placesList");

      // 기존 리스트 초기화
      listElement.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach((place) => {

        const position = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        markers.push(marker);

        // 지도 범위에 추가
        bounds.extend(position);

        // 리스트 아이템 생성
        const item = document.createElement("li");

        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">${place.address_name}</div>
        `;

        // 클릭 시 지도 이동
        item.addEventListener("click", () => {

          map.setCenter(position);

          const infoWindow = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px;">${place.place_name}</div>`
          });

          infoWindow.open(map, marker);

        });

        listElement.appendChild(item);

      });

      // 검색 결과에 맞게 지도 범위 조정
      map.setBounds(bounds);

    }

    // 기존 마커 삭제 함수
    function removeMarkers() {

      markers.forEach((marker) => {
        marker.setMap(null);
      });

      markers = [];

    }

  </script>

</body>
</html>
